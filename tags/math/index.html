			(function() {
				var theme = localStorage.getItem("theme");
				if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
				else if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
				// no stored preference → follow prefers-color-scheme (handled in CSS)
			})();
		</script>

		<style>/* ===== Minimal theme, inspired by blog.plummmm.com =====
   Light/dark via CSS variables + prefers-color-scheme + manual toggle.
   KaTeX uses currentColor, so math adapts to both themes automatically. */

:root {
  --bg: #fdfdfc;
  --fg: #1a1a1a;
  --muted: #666;
  --border: #d0d0d0;
  --link: #0b57d0;
  --accent-bg: #f2f2f0;
  --table-stripe: #f7f7f5;
}

[data-theme="dark"] {
  --bg: #141414;
  --fg: #e8e8e6;
  --muted: #9a9a98;
  --border: #3a3a3a;
  --link: #7db0ff;
  --accent-bg: #1e1e1e;
  --table-stripe: #1a1a1a;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #141414;
    --fg: #e8e8e6;
    --muted: #9a9a98;
    --border: #3a3a3a;
    --link: #7db0ff;
    --accent-bg: #1e1e1e;
    --table-stripe: #1a1a1a;
  }
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  padding: 2% 20%;
  font-size: 1.05em;
  font-family: "Sarabun", "Noto Sans", -apple-system, "Segoe UI", sans-serif;
  line-height: 1.7;
  background: var(--bg);
  color: var(--fg);
  transition: background 0.2s ease, color 0.2s ease;
}

/* Responsive: tighten gutters and bump size on small screens (plummmm-style) */
@media screen and (max-width: 1100px) {
  body {
    padding-left: 6%;
    padding-right: 6%;
  }
}

@media screen and (max-width: 640px) {
  body {
    padding-left: 4%;
    padding-right: 4%;
    font-size: 1.12em;
  }
}

a {
  color: var(--link);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* ===== Header ===== */
.site-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5em;
}

.site-title {
  font-family: "Inconsolata", "Sarabun", monospace;
  font-weight: 500;
  color: var(--muted);
  text-align: left;
  font-size: 1em;
  margin: 0;
}

.site-title a {
  color: var(--muted);
}

.theme-toggle {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--fg);
  font-size: 0.9em;
  padding: 0.25em 0.6em;
  cursor: pointer;
  font-family: inherit;
}

.theme-toggle:hover {
  background: var(--accent-bg);
}

/* ===== Home table (plummmm-style) ===== */
.post-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 1em;
}

.post-table th,
.post-table td {
  padding: 8px 10px;
  border: 1px solid var(--border);
  text-align: left;
}

.post-table th {
  font-weight: 600;
  background: var(--accent-bg);
}

.post-table tbody tr:nth-child(even) {
  background: var(--table-stripe);
}

.post-table td.date {
  white-space: nowrap;
  color: var(--muted);
  font-family: "Inconsolata", monospace;
  font-size: 0.92em;
}

@media screen and (max-width: 640px) {
  .post-table th,
  .post-table td {
    padding: 6px 8px;
  }
  .post-table td.date {
    display: none;
  }
  .post-table th.date {
    display: none;
  }
}

/* ===== Post page ===== */
.post-title {
  font-size: 1.6em;
  margin-bottom: 0.2em;
  line-height: 1.3;
}

.post-metadata {
  list-style: none;
  padding: 0;
  margin: 0 0 1.5em;
  color: var(--muted);
  font-size: 0.92em;
}

.post-metadata li {
  display: inline;
  margin-right: 0.8em;
}

.post-tag {
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0 0.4em;
  font-size: 0.85em;
}

main {
  padding-bottom: 2em;
}

/* ===== Content typography ===== */
article h2 {
  margin-top: 1.8em;
  padding-bottom: 0.2em;
  border-bottom: 1px solid var(--border);
}

article h3 {
  margin-top: 1.5em;
}

article img {
  max-width: 100%;
  height: auto;
}

pre {
  overflow-x: auto;
  padding: 0.9em 1em;
  background: var(--accent-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 0.9em;
}

code {
  font-family: "Inconsolata", ui-monospace, monospace;
}

p code,
li code {
  background: var(--accent-bg);
  padding: 0.1em 0.35em;
  border-radius: 3px;
  font-size: 0.9em;
}

blockquote {
  margin: 1em 0;
  padding: 0.2em 1.2em;
  border-left: 3px solid var(--border);
  color: var(--muted);
}

/* ===== KaTeX: inherit theme colors ===== */
.katex {
  font-size: 1.05em;
}

/* ===== Footer ===== */
.site-footer {
  margin-top: 2.5em;
  padding-top: 1em;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.85em;
}

/* ===== Nav (tags, archive, feed) ===== */
.nav {
  list-style: none;
  padding: 0;
  margin: 0 0 1.5em;
  display: flex;
  gap: 1.2em;
  flex-wrap: wrap;
}

.nav a {
  color: var(--muted);
}

.nav a[aria-current="page"] {
  color: var(--fg);
  text-decoration: underline;
}

/* ===== Next/prev ===== */
.links-nextprev {
  list-style: none;
  padding: 0;
  margin-top: 2.5em;
  display: flex;
  justify-content: space-between;
  gap: 1em;
  font-size: 0.92em;
}

/* ===== Tag index ===== */
ul.post-tags {
  list-style: none;
  padding: 0;
  display: flex;
  gap: 0.6em;
  flex-wrap: wrap;
}

/* ===== Misc ===== */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}</style>
	</head>

<table class="post-table">

			<td class="date"><time datetime="2026-08-09">2026-08-09</time></td>
		</tr>
	</tbody>
</table>


<p>See <a href="/tags/">all tags</a>.</p>


		</main>

		<footer class="site-footer">
			<p>© 0x0nigiri · <a href="/feed/feed.xml">feed</a> · <a href="/tags/">tags</a></p>
		</footer>

		<script>
			(function() {
				var btn = document.getElementById("theme-toggle");
				var root = document.documentElement;
				function current() {
					if (root.hasAttribute("data-theme")) return root.getAttribute("data-theme");
					return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
				}
				btn.addEventListener("click", function() {
					var next = current() === "dark" ? "light" : "dark";
					root.setAttribute("data-theme", next);
					localStorage.setItem("theme", next);
					btn.textContent = next === "dark" ? "☀" : "☾";
				});
				btn.textContent = current() === "dark" ? "☀" : "☾";
			})();
		</script>
		<script type="module" src=""></script>
	</body>
</html>
